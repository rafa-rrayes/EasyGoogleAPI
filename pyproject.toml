[project]
name = "easygoogleapi"
version = "2.0.0"
description = "A simplified Python interface for Google APIs"
readme = "README.md"
license = "MIT"
authors = [
    { name = "rafa-rrayes", email = "rafa@rayes.com.br" }
]
requires-python = ">=3.12"
keywords = [
    "google",
    "google-api",
    "gmail",
    "google-calendar",
    "google-drive",
    "google-sheets",
    "google-docs",
    "google-meet",
    "google-forms",
    "oauth",
    "api",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.optional-dependencies]
meet = ["google-apps-meet>=0.1.0"]
redis = ["redis>=4.0.0"]
all = ["easygoogleapi[meet,redis]"]

[project.urls]
Homepage = "https://github.com/rafa-rrayes/easygoogleapi"
Documentation = "https://github.com/rafa-rrayes/easygoogleapi/tree/master/docs"
Repository = "https://github.com/rafa-rrayes/easygoogleapi"
Issues = "https://github.com/rafa-rrayes/easygoogleapi/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easygoogleapi"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require credentials)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
